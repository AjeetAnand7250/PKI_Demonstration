
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKI Registration</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="logo">🔐 PKI SYSTEM</div>
        <h1>Create Account</h1>
        <p class="subtitle">Register for PKI Certificate Management</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>

            <button type="submit">Create Account</button>
            <p id="message"></p>
        </form>

        <p class="bottom-text">
            Already registered?
            <a href="login.html">Login Here</a>
        </p>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
